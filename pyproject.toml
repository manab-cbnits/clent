[project]
name = "clent"
version = "0.3.2"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "google-api-python-client>=2.0.0",
    "google-auth>=2.0.0",
    "google-auth-oauthlib>=1.0.0",
    "langchain>=1.2.18",
    "langchain-mcp-adapters>=0.1.0",
    "langchain-openai>=1.2.1",
    "langgraph>=1.1.10",
    "mcp>=1.0.0",
    "rich>=13.0.0",
]

[project.scripts]
clent = "clent.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clent"]

[tool.hatch.build.targets.sdist]
include = [
  "src/clent/**/*.py",
  "src/clent/**/*.json",
  "README.md",
  "pyproject.toml",
]
